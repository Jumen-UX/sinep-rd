name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_url:
        description: URL pública para ejecutar Playwright y Axe (opcional)
        required: false
        type: string
      security_dependency_refresh:
        description: Regeneración controlada de una dependencia vulnerable
        required: false
        default: none
        type: choice
        options:
          - none
          - sharp-0.35.3
      security_confirmation:
        description: Escribe REFRESH_SHARP_0_35_3 cuando selecciones sharp-0.35.3
        required: false
        type: string
  schedule:
    - cron: '17 9 * * 1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, tests and build
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.security_dependency_refresh != 'sharp-0.35.3')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-anon-key
      APP_BASE_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-node24-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node24-next-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-node24-next-

      - name: Check
        run: pnpm check

  refresh-sharp-lock:
    name: Refresh sharp 0.35.3 lockfile
    if: github.event_name == 'workflow_dispatch' && inputs.security_dependency_refresh == 'sharp-0.35.3'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-anon-key
      APP_BASE_URL: http://localhost:3000
      REQUESTED_CONFIRMATION: ${{ inputs.security_confirmation }}
    steps:
      - name: Validate explicit confirmation
        shell: bash
        run: |
          if [[ "${REQUESTED_CONFIRMATION}" != "REFRESH_SHARP_0_35_3" ]]; then
            echo "::error::La confirmación no coincide. No se regeneró el lockfile."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Regenerate patched dependency graph
        run: |
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile

      - name: Verify resolved sharp version
        shell: bash
        run: |
          RESOLVED_VERSIONS="$(pnpm list sharp --depth 20 --json | node --input-type=module -e "let input=''; process.stdin.on('data', c => input += c); process.stdin.on('end', () => { const data=JSON.parse(input); const versions=new Set(); const visit=(node)=>{ if(!node||typeof node!=='object') return; for(const [name,value] of Object.entries(node)){ if(name==='sharp' && value?.version) versions.add(value.version); visit(value); }}; visit(data); console.log([...versions].sort().join(',')); })")"
          echo "Resolved sharp versions: ${RESOLVED_VERSIONS}"
          if [[ "${RESOLVED_VERSIONS}" != "0.35.3" ]]; then
            echo "::error::Se esperaba resolver únicamente sharp 0.35.3."
            exit 1
          fi

      - name: Validate updated dependency graph
        run: pnpm check

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml

          if git diff --cached --quiet; then
            echo "El lockfile ya estaba actualizado."
            exit 0
          fi

          git commit -m "fix(security): resolve sharp 0.35.3 in lockfile"
          git push origin HEAD:main

      - name: Upload validated dependency files
        uses: actions/upload-artifact@v7
        with:
          name: sharp-0.35.3-lockfiles-${{ github.run_id }}
          path: |
            package.json
            pnpm-workspace.yaml
            pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 3

  dependency-audit:
    name: Critical dependency audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.3

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=critical

  codeql:
    name: CodeQL JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  production-e2e:
    name: Production Playwright and Axe
    if: github.event_name == 'workflow_dispatch' && inputs.base_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      E2E_BASE_URL: ${{ inputs.base_url }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_ACCESS_PROFILES_JSON: ${{ secrets.E2E_ACCESS_PROFILES_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Chromium
        run: pnpm test:e2e:install

      - name: Test public routes and accessibility
        run: pnpm test:e2e:public

      - name: Test admin import when credentials exist
        shell: bash
        run: |
          if [[ -z "${E2E_ADMIN_EMAIL}" || -z "${E2E_ADMIN_PASSWORD}" ]]; then
            echo "Admin E2E skipped: configure E2E_ADMIN_EMAIL and E2E_ADMIN_PASSWORD as repository secrets."
            exit 0
          fi
          pnpm test:e2e:admin

      - name: Test administrative access matrix when configured
        shell: bash
        run: |
          if [[ -z "${E2E_ACCESS_PROFILES_JSON}" ]]; then
            echo "Access matrix E2E skipped: configure E2E_ACCESS_PROFILES_JSON as a repository secret."
            exit 0
          fi
          pnpm test:e2e:access

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
