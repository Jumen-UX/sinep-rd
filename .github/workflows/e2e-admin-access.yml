name: E2E / Admin access matrix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/e2e-admin-access.yml'
      - 'e2e/admin-access-matrix.spec.mjs'
      - 'e2e/admin-visual-evidence.spec.mjs'
      - 'e2e/support/access-profile-matrix.mjs'
      - 'scripts/validate-e2e-access-profiles.mjs'
      - 'playwright.config.mjs'
      - 'src/app/(admin)/admin/AdminShell.tsx'
      - 'src/features/admin/navigation/**'
      - 'src/features/admin/dashboard/**'
      - 'src/features/access/**'
      - 'src/middleware.ts'

permissions:
  contents: read

concurrency:
  group: e2e-admin-access-${{ github.ref }}
  cancel-in-progress: true

jobs:
  access-matrix:
    name: Authenticated navigation and scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: qa
    env:
      CI: 'true'
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://hrvgpceqaxujlttpimdz.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_RJkFs3kYh4BoAzfGivOlvg_xBCEklGP' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_RJkFs3kYh4BoAzfGivOlvg_xBCEklGP' }}
      APP_BASE_URL: http://127.0.0.1:3000
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_APP_LOG: /tmp/sinep-next.log
      E2E_ACCESS_PROFILES_JSON: ${{ secrets.E2E_ACCESS_PROFILES_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check protected profile matrix
        id: profile-matrix
        shell: bash
        run: |
          if [[ -z "${E2E_ACCESS_PROFILES_JSON}" ]]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
              echo "::error::Configure the protected E2E_ACCESS_PROFILES_JSON secret before running the authenticated matrix manually."
              exit 1
            fi
            echo "Authenticated matrix skipped on push: configure E2E_ACCESS_PROFILES_JSON as a repository or qa environment secret."
          else
            node scripts/validate-e2e-access-profiles.mjs
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Setup pnpm
        if: steps.profile-matrix.outputs.enabled == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.3

      - name: Setup Node.js
        if: steps.profile-matrix.outputs.enabled == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.profile-matrix.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install E2E runtime
        if: steps.profile-matrix.outputs.enabled == 'true'
        run: pnpm add --save-dev --lockfile=false @playwright/test@1.61.0

      - name: Install Chromium
        if: steps.profile-matrix.outputs.enabled == 'true'
        run: pnpm exec playwright install chromium --with-deps

      - name: Build application
        if: steps.profile-matrix.outputs.enabled == 'true'
        run: pnpm build

      - name: Start application
        if: steps.profile-matrix.outputs.enabled == 'true'
        shell: bash
        run: |
          pnpm start > "${E2E_APP_LOG}" 2>&1 &
          echo "APP_PID=$!" >> "${GITHUB_ENV}"

          for attempt in {1..60}; do
            if curl --fail --silent --show-error "${APP_BASE_URL}/admin/login" > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          cat "${E2E_APP_LOG}"
          echo "::error::La aplicación no estuvo disponible para la prueba E2E."
          exit 1

      - name: Test authenticated navigation and scope
        if: steps.profile-matrix.outputs.enabled == 'true'
        run: pnpm exec playwright test e2e/admin-access-matrix.spec.mjs

      - name: Capture authenticated admin visual evidence
        if: steps.profile-matrix.outputs.enabled == 'true'
        run: pnpm exec playwright test e2e/admin-visual-evidence.spec.mjs

      - name: Upload Playwright diagnostics
        if: always() && steps.profile-matrix.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-admin-access-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            ${{ env.E2E_APP_LOG }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop application
        if: always() && steps.profile-matrix.outputs.enabled == 'true'
        shell: bash
        run: |
          if [[ -n "${APP_PID:-}" ]]; then
            kill "${APP_PID}" 2>/dev/null || true
          fi
